spring:
  application:
    name: service-track-bff

server:
  port: ${ST_BFF_PORT:8080}
  shutdown: graceful

servicetrack:
  usuarios:
    base-url: ${ST_BFF_USUARIOS_URL:http://localhost:8081}
    connect-timeout: ${ST_BFF_CONNECT_TIMEOUT:1s}
    response-timeout: ${ST_BFF_RESPONSE_TIMEOUT:2s}
  resilience:
    max-attempts: ${ST_BFF_MAX_ATTEMPTS:3}
    initial-backoff: ${ST_BFF_INITIAL_BACKOFF:200ms}
    backoff-multiplier: ${ST_BFF_BACKOFF_MULTIPLIER:2.0}
    max-backoff: ${ST_BFF_MAX_BACKOFF:2s}
    sliding-window-size: ${ST_BFF_SLIDING_WINDOW_SIZE:20}
    minimum-number-of-calls: ${ST_BFF_MINIMUM_CALLS:10}
    failure-rate-threshold: ${ST_BFF_FAILURE_RATE_THRESHOLD:50}
    wait-duration-in-open-state: ${ST_BFF_WAIT_DURATION_IN_OPEN_STATE:10s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${ST_BFF_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ${ST_BFF_LOG_FORMAT:logstash}
  pattern:
    correlation: "[${spring.application.name:service-track-bff},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{requestId:-}] "
